[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ast = true
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 1024

[invariant]
runs = 64
depth = 48
fail_on_revert = false

[rpc_endpoints]
elysium = "https://rpc.elysium.kinetiq.xyz"

[lint]
lint_on_build = false
